[package]
name = "varlink-http-client"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"
description = "Client side of the varlink-http-bridge: dial a varlink-httpd and get a WebSocket that carries raw varlink"

[features]
default = ["sshauth"]
sshauth = ["dep:ssh-key", "dep:sshauth", "varlink-http-core/sshauth"]

[dependencies]
varlink-http-core = { path = "../varlink-http-core", default-features = false }
anyhow = "1.0.100"
http = "1"
tokio = { version = "1.49.0", features = ["net", "io-util", "time"] }
log = "0.4"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
# using openssl here to keep size small, rusttls adds ~1.8MB binary size
# and nativetls does not support mTLS
openssl = "0.10.81"
tokio-openssl = "0.6"
# TODO: switch back to crates.io once tokio-vsock releases a version with
# From<OwnedFd> support (https://github.com/rust-vsock/tokio-vsock/pull/72)
tokio-vsock = { git = "https://github.com/rust-vsock/tokio-vsock.git", rev = "c6225086" }
ssh-key = { version = "0.6", optional = true }
# TODO: switch back to crates.io once SkEd25519 (hardware key) support is
# merged and released (https://github.com/mvo5/sshauth/tree/add-support-for-SkEd25519)
# (see https://github.com/oxidecomputer/sshauth/pull/8)
sshauth = { git = "https://github.com/mvo5/sshauth.git", branch = "add-support-for-SkEd25519", optional = true }

[dev-dependencies]
# test-only constructors, e.g. `TlsChannelBinding::new`
varlink-http-core = { path = "../varlink-http-core", default-features = false, features = ["test-helpers"] }
tempfile = "3.27"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
